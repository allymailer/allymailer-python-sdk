[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allymailer-python-sdk"
version = "1.1.2"
description = "AllyMailer Web API client library for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AllyMailer" }]
keywords = ["allymailer", "email", "api", "sdk"]
dependencies = []

[project.urls]
Homepage = "https://github.com/allymailer/allymailer-python-sdk"
Documentation = "https://docs.allymailer.com.ua/ua/web-api-ref"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
